<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Empire · Mappa</title>
<style>
  :root { --bg: #07090d; --panel: rgba(17, 21, 28, .92); --line: #263040; --text: #d6dde8;
          --dim: #8592a6; --accent: #ff4d4d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
               font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; gap: 12px; align-items: center;
         padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
         white-space: nowrap; overflow: hidden; }
  #top .title { font-weight: 600; letter-spacing: .04em; }
  #top .dim { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  #top .clock { margin-left: auto; color: var(--accent); font-variant-numeric: tabular-nums; }
  #top button, #tools button { font: inherit; color: var(--text); background: #1a2130; border: 1px solid var(--line);
                border-radius: 6px; padding: 3px 10px; cursor: pointer; }
  #side { position: fixed; top: 38px; right: 8px; width: 300px; max-height: calc(100% - 50px); overflow: auto;
          background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  #side.closed { display: none; }
  #side h3 { margin: 10px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); }
  #side h3:first-child { margin-top: 0; }
  .fac { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .fac .sw { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .fac .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fac.me .n { font-weight: 600; }
  .fac.out .n { text-decoration: line-through; color: var(--dim); }
  .fac .c { color: var(--dim); font-variant-numeric: tabular-nums; }
  #cell { color: var(--text); }
  #cell .u { display: inline-flex; align-items: center; gap: 4px; margin: 2px 6px 2px 0; }
  #cell .tok { display: inline-block; min-width: 18px; padding: 0 3px; border-radius: 3px; color: #fff;
               font: 600 12px/18px ui-monospace, monospace; text-align: center; }
  #log div { padding: 2px 0; border-top: 1px solid var(--line); font-size: 13px; }
  #log div:first-child { border-top: 0; }
  #log .t { color: var(--dim); font-variant-numeric: tabular-nums; margin-right: 6px; }
  #log .alert, #log .wmd { color: #ffb4a8; }
  #tools { position: fixed; left: 8px; bottom: 8px; display: flex; gap: 6px; }
  #tools button { padding: 6px 12px; font-size: 16px; }
  #tools button.on { border-color: var(--accent); }
  #tools button.go { background: var(--accent); border-color: var(--accent); color: #fff; font-size: 14px;
                     font-weight: 600; letter-spacing: .04em; }
  #tools button.go:disabled { opacity: .35; cursor: default; }
  #turnTag { padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #1a2130; color: var(--dim); }
  #turnTag.mine { background: #1f6f3a; color: #fff; }
  .orders { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .orders button { font: inherit; font-size: 12px; color: var(--text); background: #1a2130; border: 1px solid var(--line);
                   border-radius: 5px; padding: 3px 8px; cursor: pointer; }
  .orders button:disabled { opacity: .35; cursor: default; }
  #active .muted { color: var(--dim); }
  #toast { position: fixed; left: 50%; bottom: 60px; transform: translateX(-50%); max-width: 90%;
           background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px;
           opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.on { opacity: 1; }
  #prod { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: center;
          justify-content: center; padding: 16px; }
  #prod.on { display: flex; }
  #prod .dlg { width: min(560px, 100%); max-height: 100%; overflow: auto; background: #11151c;
               border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  #prod .hd { display: flex; align-items: center; gap: 8px; }
  #prod .hd b { flex: 1; }
  #prod .x { font: inherit; background: none; border: 0; color: var(--dim); cursor: pointer; font-size: 18px; }
  #prod .now { color: var(--dim); margin: 2px 0 8px; font-size: 13px; }
  #prod .opt { display: grid; grid-template-columns: 26px 1fr auto; grid-template-rows: auto auto; gap: 0 8px;
               width: 100%; text-align: left; font: inherit; color: var(--text); background: #161b24;
               border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; margin-top: 4px; cursor: pointer; }
  #prod .opt:hover, #prod .opt:focus { border-color: #4a5a72; outline: none; }
  #prod .opt.cur { border-color: var(--accent); }
  #prod .opt .tok { grid-row: span 2; align-self: center; display: inline-block; min-width: 22px; padding: 0 3px;
                    border-radius: 4px; color: #fff; font: 700 13px/22px ui-monospace, monospace; text-align: center; }
  #prod .opt .tok.sp { background: #3a3f4a; }
  #prod .opt .nm { font-weight: 600; }
  #prod .opt .cs { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #prod .opt .st { grid-column: 2 / span 2; color: var(--dim); font-size: 12px; }
  @media (min-width: 700px) { #prod .list { display: grid; grid-template-columns: 1fr 1fr; gap: 0 6px; } }
  #prod .dlg { width: min(720px, 100%); }
  #prod .opt.back { display: block; text-align: center; margin-top: 10px; }
  #prod .note { color: var(--dim); font-size: 12px; margin-top: 10px; }
  #reel { position: fixed; top: 46px; left: 50%; transform: translateX(-50%); width: min(620px, calc(100% - 16px));
          background: rgba(10, 12, 16, .9); border: 1px solid #5a2a2a; border-radius: 8px; padding: 6px 12px 8px;
          display: none; }
  #reel.on { display: block; }
  #reel .head { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .1em;
                color: var(--accent); font-weight: 600; }
  #reel .head span { flex: 1; }
  #reel button { font: inherit; font-size: 12px; color: var(--text); background: #1a2130; border: 1px solid var(--line);
                 border-radius: 5px; padding: 2px 10px; cursor: pointer; letter-spacing: 0; }
  #reelLine { min-height: 1.4em; margin-top: 3px; }
  #reelLine.us { color: #ffb4a8; font-weight: 600; }
  @keyframes shake { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(-4px, 2px); }
                     50% { transform: translate(4px, -2px); } 75% { transform: translate(-2px, -3px); } }
  canvas.shake { animation: shake .35s linear 2; }
  #notice { position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); max-width: 440px;
            background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px;
            text-align: center; display: none; }
  #notice a { color: var(--accent); }
  @media (max-width: 640px) {
    #side { left: 8px; right: 8px; width: auto; top: auto; bottom: 52px; max-height: 42%; }
    #top .dim { display: none; }
  }
</style>
</head>

<canvas id="map"></canvas>
<div id="top">
  <span class="title">THE EMPIRE</span>
  <span class="dim" id="info"></span>
  <span id="turnTag"></span>
  <span class="clock" id="clock"></span>
  <button id="panelBtn">☰</button>
</div>
<div id="side">

  <h3 data-t="activeH">Unità attiva</h3>

  <div class="orders" id="orders">

    <button data-o="skip" data-t="skip">Salta</button>
    <button data-o="sentry" data-t="sentry">Sentinella</button>
    <button data-o="fortify" data-t="fortify">Fortifica</button>
    <button data-o="wake" data-t="wake">Sveglia</button>
  </div>
  <h3 data-t="selected">Casella</h3>
  <div id="cell" data-t="clickHint">Tocca o clicca una casella.</div>
  <h3 data-t="events">Eventi</h3>
  <div id="log"></div>
</div>
<div id="tools">
  <button id="zin" title="Zoom +">+</button>
  <button id="zout" title="Zoom −">−</button>
  <button id="home" title="⌂">⌂</button>
  <button id="labels" title="Aa">Aa</button>
  <button id="aspect" title="⬡">⬡</button>
  <button id="sound" title="🔊">🔊</button>
  <button id="endTurn" class="go" data-t="endTurn">FINE TURNO</button>
</div>
<div id="notice"></div>
<div id="toast"></div>
<div id="prod"></div>
<div id="reel"><div class="head"><span id="reelTitle"></span><button id="reelSkip"></button></div>
  <div id="reelLine"></div></div>

                 magenta: "#d946ef", yellow: "#eab308", white: "#e5e7eb" };
const SEA = "#0a1726", LAND = "#4a5040";
const color = (f) => (f >= 0 && state ? COLORS[state.factions[f].color] || "#aaa" : LAND);
function mix(a, b, t) {
  const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
  const x = p(a), y = p(b);
  return "rgb(" + x.map((v, i) => Math.round(v * (1 - t) + y[i] * t)).join(",") + ")";

    `<div class="now">⚙ ${esc(pr.name)} · ${Math.floor(pr.progress)}/${pr.cost}</div>` +
    `<div class="list">${rows.join("")}</div>${foot}</div>`;

      phantoms.set("mv", { from: first ? null : prevCell, to: a.cell, start: performance.now(),
                           dur: first ? 180 : 140, owner: a.owner, glyph: a.glyph });
      await sleep(first ? 220 : 150);
      prevUnit = a.unit; prevCell = a.cell;
      if (last.get(a.unit) === i) { hidden.delete(a.unit); phantoms.delete("mv"); }
      continue;
    }
    phantoms.delete("mv"); prevUnit = null;
    shown++;
    const us = a.defender === state.viewer || a.old === state.viewer || a.victim === state.viewer;
    scene(a.line, us);
    if (a.op === "nuke" || a.op === "fall") await panTo(a.cell);
    else await camera(a.cell, closeUp(), 500);
    if (a.op === "attack") { await battle(a, us ? 1.3 : 1); continue; }
    if (a.op === "capture") {
      ripple(a.cell, color(a.new), 900, 3); mark(a.cell, "⚑", color(a.new), 1100);
      sfx(a.old === state.viewer ? "loss" : "capture"); await sleep(950);
    } else if (a.op === "fall") {
      sfx("fall"); ripple(a.cell, "#ff4d4d", 1200, 3); await sleep(1100);
    } else if (a.op === "nuke") {
      sfx("nuke");
      effect(260, (k) => { ctx.save(); ctx.globalAlpha = 1 - k; ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, innerWidth, innerHeight); ctx.restore(); });
      boom(a.cell, 3.2, "255,120,30"); ripple(a.cell, "#ffe066", 1600, 3);
      canvas.classList.add("shake"); await sleep(1700); canvas.classList.remove("shake");
    } else if (a.op === "chem") {
      sfx("gas");
      for (let k = 0; k < 5; k++) boom(a.cell, 1.5 + k * 0.2, "120,220,60");
      await sleep(1100);
    } else if (a.op === "card") {
      sfx("card"); mark(a.cell, "♠", "#d946ef", 1000); await sleep(1000);
    }
  }
  phantoms.clear(); hidden.clear();
  $("reel").classList.remove("on"); scene("");
  // back to where the player was looking
  skipReel = false;
  const cx = before.x + innerWidth / 2 / (before.s * view.ax), cy = before.y + innerHeight / 2 / before.s;
  const back = cellAt(cx, cy);
  if (back >= 0) await camera(back, before.s, 450);
  view.x = before.x; view.y = before.y; view.s = before.s; clampView();
  playing = false;
  draw();
}
$("reelSkip").onclick = () => { skipReel = true; };

// ---------------------------------------------------------------- data
function notice(html) { const n = $("notice"); n.innerHTML = html || ""; n.style.display = html ? "block" : "none"; }
async function loadWorld(hex) {
  world = await (await fetch(ROOT + "map/world.json?hex=" + (hex ? 1 : 0))).json();
  world.landBits = bits(world.land, world.width * world.height);
  if (world.hd) { CW = world.hd[0]; CH = world.hd[1]; }
  base = null;
  // hexagons look like a board game by default, squares like a map
  board = store.get("theempire.map.board." + (world.hex ? "hex" : "sq"), world.hex ? "1" : "0") === "1";
  setAspect();
  if (!landImg) {
    landImg = await new Promise((ok) => {
      const img = new Image(); img.onload = () => ok(img); img.onerror = () => ok(null); img.src = ROOT + "map/land.png";
    });
  }
}
async function onState(d) {
  if (!world || world.hex !== d.hex) await loadWorld(d.hex);
  if (d.territory) territory = d.territory;
  state = d;
  state.cityAt = new Map(d.cities.map((c) => [c[2], c]));
  state.cityById = new Map(d.cities.map((c) => [c[0], c]));
  if (!territory) return;
  buildBase();
  if (!fitted) { fit(); fitted = true; }
  if (d.turn !== skippedTurn) { skipped.clear(); skippedTurn = d.turn; }
  // the active unit: still ours and with moves, or the next one waiting for orders
  const a = activeUnit();
  if (d.my_turn && (!a || a[6] <= 0 || a[7])) {
    const had = active != null;
    active = a ? a[0] : null;
    if (state.units.some(waiting)) selectNext(); else if (had) select(null);
  }
  if (!d.my_turn) route = null;
  const tag = $("turnTag");
  const cur = d.factions[d.current];
  tag.textContent = d.realtime ? "⚡" : d.my_turn ? T.yourTurn : `${T.turnOf} ${cur ? cur.name : ""}`;
  tag.classList.toggle("mine", !!d.my_turn);
  $("endTurn").disabled = !d.my_turn;
  panel(); activePanel(); draw();
  if (d.reel && d.reel.length) reelQueue = reelQueue.then(() => playReel(d.reel));
}
let reelQueue = Promise.resolve();
let queue = Promise.resolve();
// a link from the terminal (W) brings its seat after the #: kept for this tab
// only, and never sent in an address
let seat = "";
const fromLink = /(?:^|[#&])seat=([0-9a-f]{32})/.exec(location.hash);
if (fromLink) {
  seat = fromLink[1];
  try { sessionStorage.setItem("theempire.seat", seat); } catch (e) {}
  history.replaceState(null, "", location.pathname);
} else {
  try { seat = sessionStorage.getItem("theempire.seat") || ""; } catch (e) {}
}
function connect() {
  if (!seat && !/^[0-9a-f]{32}$/.test(browserId)) { notice(T.noseat); return; }
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = socket = new WebSocket(`${proto}//${location.host}${ROOT}map/ws?id=${browserId}&lang=${lang}`);
  ws.onopen = () => ws.send(JSON.stringify({ t: "hello", seat }));
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.t === "state") { notice(""); queue = queue.then(() => onState(m.d)).catch(console.error); }
    else if (m.t === "result") { const then = pending.get(m.id); pending.delete(m.id); if (then) then(m); }
    else if (m.t === "path") {
      if (route && route.cell === m.cell && m.unit === active) {
        if (m.route) { route.cells = m.route; toast(T.routeHint); } else { route = null; toast(T.unreachable); }
        draw();
      }
    }
    else if (m.t === "noseat") notice(T.noseat);
    else if (m.t === "offline") notice(T.offline);
  };
  ws.onclose = () => { notice(T.offline); setTimeout(connect, 3000); };
}
resize();
connect();
</script>
